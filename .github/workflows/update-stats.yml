
name: Atualizar estatísticas do GitHub

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Gerar estatísticas gerais
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: isadoraeler
          template: classic
          base: repositories, activity, community
          config_timezone: America/Sao_Paulo
          filename: github-metrics.svg

      - name: Gerar linguagens mais utilizadas
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: isadoraeler
          template: classic
          base: ""
          plugin_languages: yes
          plugin_languages_limit: 5
          plugin_languages_sections: most-used
          filename: top-langs.svg
